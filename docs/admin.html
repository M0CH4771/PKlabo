<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-src 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>管理画面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=202611171857">
<script src="config.js?v=202611171857"></script>
<style>
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; scrollbar-width: none; }
  .tabs { border-bottom: 2px solid var(--ink); gap: 2px; margin-bottom: 16px; }
  .tabs button { flex: none; border: 1px solid var(--line2); border-bottom: none; background: #fff; padding: 8px 14px; border-radius: 3px 3px 0 0; font-weight: 700; cursor: pointer; font-family: inherit; color: var(--ink); }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tabs .badge { position: static; display: inline-grid; margin-left: 4px; }
  .panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .orders { display: grid; gap: 10px; }
  .order { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--ink); border-radius: 3px; padding: 12px 14px; display: grid; gap: 6px; }
  .order .items { font-size: 13px; background: #f4f5f7; padding: 8px 10px; border-radius: 2px; }
  .order .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .order input.trk { width: 170px; padding: 6px 10px; font-size: 14px; }
  .order select { padding: 6px 26px 6px 10px; font-size: 13px; }
  .order textarea { font-size: 13px; padding: 6px 10px; }
  .order .sel { display: flex; align-items: center; gap: 8px; }
  .hint { background: #fff8cc; border-radius: 2px; padding: 4px 8px; font-size: 12.5px; }
  .pill { font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 2px; border: 1px solid currentColor; color: var(--blue); background: #fff; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  .t th, .t td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  .t th { font-size: 12px; color: var(--muted); font-weight: 700; white-space: nowrap; border-bottom: 2px solid var(--ink); }
  .t td.num, .t th.num { text-align: right; white-space: nowrap; }
  tr.off td { opacity: .45; }
  .thumb { width: 36px; aspect-ratio: 5/7; object-fit: contain; background: #f0f0f2; border-radius: 4px; }
  .stockctl { display: inline-flex; align-items: center; gap: 4px; }
  .stockctl button { width: 26px; height: 26px; border: 1px solid var(--line2); background: #fff; border-radius: 2px; cursor: pointer; font-family: inherit; }
  dialog.ed { border: none; border-top: 4px solid var(--ink); border-radius: var(--radius); padding: 0; width: min(620px, 96vw); }
  dialog.ed form { padding: 18px; display: grid; gap: 10px; max-height: 90vh; overflow-y: auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 10px 14px; }
  .stat b { display: block; font-family: var(--f-pop); font-weight: 400; font-size: 22px; line-height: 1.4; }
  .stat .sub2 { font-size: 12px; color: var(--muted); }
  .overflow { overflow-x: auto; }
  .imgs { display: flex; flex-wrap: wrap; gap: 8px; }
  .imgs .im { position: relative; width: 70px; }
  .imgs img { width: 70px; aspect-ratio: 5/7; object-fit: cover; border-radius: 3px; background: #eee; }
  .imgs .im button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--ink); color: #fff; cursor: pointer; font-size: 12px; }
  .imgs .im .main { position: absolute; bottom: 2px; left: 2px; font-size: 9px; background: var(--accent); color: #fff; padding: 0 4px; border-radius: 3px; }
  .upl { width: 70px; aspect-ratio: 5/7; border: 1px dashed var(--line2); border-radius: 3px; background: #fff; display: grid; place-items: center; font-size: 11px; color: var(--muted); cursor: pointer; text-align: center; }
  .upl input { display: none; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 10px; }
  .bars div { flex: 1; background: var(--ink); min-height: 2px; position: relative; }
  .bars div:hover { background: var(--accent); }
  .bars div:hover::after { content: attr(data-t); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .two { display: grid; gap: 12px; }
  @media (min-width: 800px) { .two { grid-template-columns: 1fr 1fr; } }
  .toolbar2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .vrow td:nth-child(2) { padding-left: 22px; }
  .vrow td:nth-child(2)::before { content: "└ "; color: var(--muted); }
  .grp td { border-top: 2px solid var(--line); }
  .fs { background: #fff; border-radius: var(--radius); padding: 16px; margin-bottom: 12px; display: grid; gap: 10px; }
  .fs h3 { margin: 0; font-size: 15px; }
  .fs .hint2 { font-size: 12px; color: var(--muted); margin: -4px 0 0; }
  .feat { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px 14px; }
  .feat label { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; font-weight: 600; }
  .feat label span { font-weight: 400; color: var(--muted); font-size: 12px; display: block; }
  .rows { display: grid; gap: 6px; }
  .rows .r { display: grid; gap: 6px; grid-template-columns: 1fr 2fr auto; align-items: center; }
  .rows .r.p6 { grid-template-columns: 70px 1.6fr 1.6fr 70px 90px 40px auto; }
  .fxgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 12px; }
  .fxrow { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; }
  .fxrow span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fxrow select { padding: 6px 26px 6px 8px; font-size: 13px; }
  dialog.ed.picker { width: min(760px, 94vw); }
  dialog.picker tr[data-id]:hover { background: var(--bg); }
  .rows .r input { padding: 7px 9px; font-size: 14px; }
  .savebar { position: sticky; bottom: 0; background: rgba(244,244,247,.95); padding: 10px 0; display: flex; gap: 10px; justify-content: flex-end; }
  .envs { display: flex; flex-wrap: wrap; gap: 6px; }
  .envs span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #eee; }
  .envs span.on { background: #e1f3e8; color: var(--ok); }
  .prog { height: 6px; background: var(--bg); overflow: hidden; } .prog i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .vtable input { padding: 6px 8px; font-size: 14px; }
</style>
</head>
<body>
<header class="site-header">
  <a href="admin.html" class="logo"><span class="logo-mark">PK</span><span class="logo-text">管理画面</span></a>
  <button class="btn sm" id="logout" hidden>ログアウト</button>
</header>
<main class="container" id="app"></main>
<div id="toast" class="toast" hidden></div>
<dialog id="dlg" class="ed"></dialog>
<script src="opening.js?v=202611171857"></script>
<script src="admin.js?v=202611171857"></script>
</body>
</html>
